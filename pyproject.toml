[project]
name = "mouseion"
version = "0.1.0"
description = "A local provider registry that turns heterogeneous public-record APIs into one tool surface for a local LLM."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "mcp>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
embeddings = [
    "fastembed>=0.4",
]

[project.scripts]
mouseion = "mouseion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mouseion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real upstream APIs; run with -m live"]
addopts = "-m 'not live'"
