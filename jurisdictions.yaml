# Jurisdiction registry for local elections.
#
# Every entry names the official election authority and, where one exists, the
# campaign-finance authority. URLs are seeds, not claims: `mouseion civic
# discover` probes each one and records what it actually serves. A source is
# promoted to a provider only after it passes that probe.
#
# Level is `state`, `territory`, or `city`. State election-office URLs come from
# the USA.gov state and local election office directory
# (https://www.usa.gov/state-election-office). Campaign-finance URLs point at the
# state or municipal disclosure authority, not at an aggregator.
#
# When an authority is `null`, the note says who actually holds the data. That is
# a gap in the matrix, not a guess.

jurisdictions:
