id: pa_attorney_general_news
title: Pennsylvania attorney general news
category: government
domain: governance_legislative
sub_category: state_government_announcements
adapter: rss
base: https://www.attorneygeneral.gov
regions: [US]
jurisdictions: [US-PA]
description: >-
  The Pennsylvania Office of Attorney General's official news feed: charges,
  lawsuits, consumer alerts, settlements and public-integrity actions, as the
  office publishes them. Returns title, link, publication date and summary.
  Keyless.
docs_url: https://www.attorneygeneral.gov/news/
keywords:
  - pennsylvania attorney general
  - pa attorney general
  - pennsylvania lawsuit
  - consumer alert pennsylvania
  - harrisburg attorney general
  - pennsylvania charges
attribution: "Pennsylvania Office of Attorney General"
auth:
  type: none
source:
  is_primary: true
  originator: "Pennsylvania Office of Attorney General"
  originator_domain: attorneygeneral.gov
  provenance: official
  tier: 1
  auth_policy:
    free: true
    credit_card_required: false
    trial: false
    evidence_url: https://www.attorneygeneral.gov/news/
    verified_at: 2026-11-01
  rate_limit: {per_min: 30, burst: 5, concurrency: 2}
cache_ttl: 600
limits:
  rps: 1
capabilities:
  announcements:
    description: >-
      Recent Pennsylvania attorney general announcements, newest first. Returns
      the title, link, publication date and summary. `query` filters the current
      window by keyword across title and summary.
    path: /feed/
    params:
      query:
        type: string
        description: >-
          Keyword filter applied locally, e.g. 'consumer' or 'charges'.
      limit:
        type: integer
        description: Records per page (1-50, default 20).
        default: 20
    pagination: {mode: offset, default_limit: 20, max_limit: 50}
    local_window: true
    id_field: id
    fields:
      id: id
      title: title
      link: link
      published: published
      summary: summary
      author: author
      categories: categories
    strip_html: [summary]
    source_url_template: "{link}"
    query_map: {text: query, limit: limit}
    exemplars:
      - what did the Pennsylvania attorney general announce
      - Pennsylvania consumer alert
      - PA attorney general charges
      - Harrisburg lawsuit announcement
    example: {limit: 5}
