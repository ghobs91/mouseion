id: gov_uk
title: GOV.UK
category: government
regions: [GB]
description: >-
  UK government content from the official GOV.UK search API: guidance, policy
  papers, consultations, news and statistics, with the publishing organisations
  and last-updated timestamps. Keyless.
docs_url: https://www.gov.uk/api/search.json
keywords:
  - gov.uk
  - uk government
  - guidance
  - policy paper
  - consultation
  - white paper
  - legislation
  - hmrc
  - department
  - public body
  - british
base: https://www.gov.uk/api
adapter: rest_json
auth:
  type: none
attribution: "GOV.UK, licensed under the Open Government Licence v3.0"
cache_ttl: 3600
limits:
  rps: 5
capabilities:
  search_content:
    description: >-
      Search GOV.UK pages by keyword. Returns title, path, description, format,
      last-updated timestamp and publishing organisations.
    path: /search.json
    params:
      q:
        type: string
        required: true
        description: Search terms, e.g. "artificial intelligence guidance".
      limit:
        type: integer
        description: Results per page (1-100, default 10).
        default: 10
    pagination:
      mode: offset
      param: start
      limit_param: count
      default_limit: 10
      max_limit: 100
    record_path: results
    id_field: path
    source_url_template: "https://www.gov.uk{path}"
    fields:
      title: title
      path: link
      description: description
      updated: public_timestamp
      format: format
      organisations: organisations
    pluck:
      organisations: title
    version_field: total
    exemplars:
      - UK government guidance on artificial intelligence
      - recent consultations from the Department for Education
      - HM Treasury policy papers
      - UK statistics on net migration
    example:
      q: artificial intelligence guidance
      limit: 5
