    description: >-
      The table structure of one FRED release: element ids, parent/child order and
      the series behind each row. Set include_observation_values to add the value
      and date for series rows.
    path: /release/tables
    params:
      release_id:
        type: integer
        required: true
        description: FRED release id, e.g. 53.
      element_id:
        type: integer
        description: Table element to read; omit for the top-most element.
      include_observation_values:
        type: string
        enum: ["true", "false"]
        description: Include the observation value and date for series elements.
        default: "false"
      observation_date:
        type: string
