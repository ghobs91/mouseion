id: fred
title: FRED (Federal Reserve Economic Data)
category: finance
domain: financial_sovereign
sub_category: economic_series
description: >-
  FRED, the St. Louis Fed's database of 800,000+ economic time series: unemployment,
  CPI, GDP, payrolls, the federal funds rate, Treasury yields, regional data and
  more. Requires a free API key in FRED_API_KEY.
docs_url: https://fred.stlouisfed.org/docs/api/fred/
keywords:
  - fred
  - federal reserve economic data
  - economic data
  - time series
  - unemployment
  - inflation
  - cpi
  - consumer price index
  - gdp
  - payrolls
  - federal funds rate
  - treasury yield
  - interest rate
  - recession
  - regional data
  - vintage data
base: https://api.stlouisfed.org/fred
adapter: rest_json
auth:
  type: api_key
  env: FRED_API_KEY
  signup_url: https://fred.stlouisfed.org/docs/api/api_key.html
  param: api_key
  location: query
attribution: "Federal Reserve Bank of St. Louis"
source:
  is_primary: true
  originator: "Federal Reserve Bank of St. Louis"
  originator_domain: stlouisfed.org
  provenance: official
  tier: 2
  auth_policy:
    free: true
    credit_card_required: false
    trial: false
    evidence_url: https://fred.stlouisfed.org/docs/api/api_key.html
    verified_at: 2026-10-29
  rate_limit:
    per_min: 300
    burst: 10
    concurrency: 4
cache_ttl: 3600
limits:
  rps: 5
capabilities:
  # -- series discovery ---------------------------------------------------
  search_series:
    description: >-
      Find economic series by text. Returns series ids with title, units, frequency
      and date range. Use the id with `series_observations`. Supports filters by
      tag, frequency, units and seasonal adjustment.
    path: /series/search
    params:
      search_text:
        type: string
        required: true
        description: Words describing the series, e.g. "unemployment rate".
      search_type:
        type: string
        enum: [full_text, series_id]
        description: Match series attributes (full_text) or the series id itself.
        default: full_text
      tag_names:
        type: string
        description: Semicolon-delimited tags the series must all have, e.g. "usa;gdp".
      exclude_tag_names:
        type: string
        description: Semicolon-delimited tags the series must not have.
      filter_variable:
        type: string
        enum: [frequency, units, seasonal_adjustment]
        description: Attribute to filter with filter_value.
      filter_value:
        type: string
        description: Value for filter_variable, e.g. "Monthly" or "Percent".
      order_by:
        type: string
        description: >-
          Result order. Defaults to search_rank for full_text and series_id for
          series_id searches.
      sort_order:
        type: string
        enum: [asc, desc]
        description: Sort direction for order_by.
      limit:
        type: integer
        description: Series per page (1-100, default 20).
        default: 20
    defaults:
      file_type: json
    pagination:
      mode: offset
      param: offset
      limit_param: limit
      default_limit: 20
      max_limit: 100
    record_path: seriess
    id_field: id
    source_url_template: "https://fred.stlouisfed.org/series/{id}"
    fields:
      id: id
      title: title
      units: units
      frequency: frequency
      seasonal_adjustment: seasonal_adjustment
      observation_start: observation_start
      observation_end: observation_end
      last_updated: last_updated
    version_field: count
    exemplars:
      - unemployment rate over time
      - consumer price index inflation series
      - what is the current federal funds rate
      - GDP growth data
      - find economic series matching a topic
    example:
      search_text: unemployment rate
      limit: 5
  series_by_tags:
    description: >-
      Find series that match all of a set of FRED tags (and none of the excluded
      tags). Use `tags` to discover tag names first.
    path: /tags/series
    params:
      tag_names:
        type: string
        required: true
        description: Semicolon-delimited tags the series must all have, e.g. "usa;gdp".
      exclude_tag_names:
        type: string
        description: Semicolon-delimited tags the series must not have.
      order_by:
        type: string
        description: Result order, e.g. series_id, title, popularity.
      sort_order:
        type: string
        enum: [asc, desc]
        description: Sort direction for order_by.
      limit:
        type: integer
        description: Series per page (1-1000, default 20).
        default: 20
    defaults:
      file_type: json
    pagination:
      mode: offset
      param: offset
      limit_param: limit
      default_limit: 20
      max_limit: 1000
    record_path: seriess
    id_field: id
    source_url_template: "https://fred.stlouisfed.org/series/{id}"
    fields:
      id: id
      title: title
      units: units
      frequency: frequency
      seasonal_adjustment: seasonal_adjustment
      observation_start: observation_start
      observation_end: observation_end
      last_updated: last_updated
      popularity: popularity
    version_field: count
    exemplars:
      - series tagged with usa and gdp
      - find series by FRED tags
      - all monthly series about inflation
    example:
      tag_names: "usa;gdp"
      limit: 5
  series_updates:
    description: >-
      Series sorted by when their observations were last updated on the FRED
      server. Useful for "what changed recently" questions.
    path: /series/updates
    params:
      filter_value:
        type: string
        enum: [macro, regional, all]
        description: Restrict to macroeconomic, regional (US state/county/MSA) or all series.
        default: all
      start_time:
        type: string
        description: Earliest update time, YYYYMMDDHhmm (requires end_time).
      end_time:
        type: string
        description: Latest update time, YYYYMMDDHhmm (requires start_time).
      limit:
        type: integer
        description: Series per page (1-1000, default 20).
        default: 20
    defaults:
      file_type: json
    pagination:
      mode: offset
      param: offset
      limit_param: limit
      default_limit: 20
      max_limit: 1000
    record_path: seriess
    id_field: id
    source_url_template: "https://fred.stlouisfed.org/series/{id}"
    fields:
      id: id
      title: title
      units: units
      frequency: frequency
      seasonal_adjustment: seasonal_adjustment
      observation_start: observation_start
      observation_end: observation_end
      last_updated: last_updated
      popularity: popularity
    version_field: count
    exemplars:
      - which economic series were updated most recently
      - latest FRED data updates
      - recently updated economic indicators
    example:
      limit: 5

  # -- series metadata and observations -----------------------------------
  series:
    description: >-
      Get the metadata for one FRED series: title, units, frequency, seasonal
      adjustment, coverage dates, popularity and notes.
    path: /series
    params:
      series_id:
        type: string
        required: true
        description: FRED series id, e.g. UNRATE or GDP.
      realtime_start:
        type: string
        description: Start of the real-time period, YYYY-MM-DD.
      realtime_end:
        type: string
        description: End of the real-time period, YYYY-MM-DD.
    defaults:
      file_type: json
    record_path: seriess
    id_field: id
    source_url_template: "https://fred.stlouisfed.org/series/{id}"
    fields:
      id: id
      title: title
      units: units
      units_short: units_short
      frequency: frequency
      frequency_short: frequency_short
      seasonal_adjustment: seasonal_adjustment
      seasonal_adjustment_short: seasonal_adjustment_short
      observation_start: observation_start
      observation_end: observation_end
      last_updated: last_updated
      popularity: popularity
      notes: notes
    exemplars:
      - what are the units and frequency of GDP
      - describe the UNRATE series
      - when does a FRED series start and end
    example:
      series_id: GDP
  series_categories:
    description: >-
      Categories that contain one FRED series. Walks from a series id back into
      the category tree.
    path: /series/categories
    params:
      series_id:
        type: string
        required: true
        description: FRED series id, e.g. GDP.
      realtime_start:
        type: string
        description: Start of the real-time period, YYYY-MM-DD.
      realtime_end:
        type: string
        description: End of the real-time period, YYYY-MM-DD.
    defaults:
      file_type: json
    record_path: categories
    id_field: id
    source_url_template: "https://fred.stlouisfed.org/categories/{id}"
    fields:
      id: id
      name: name
      parent_id: parent_id
    exemplars:
      - which categories contain the GDP series
      - FRED category for a series
    example:
      series_id: GDP
  series_release:
    description: >-
      The release that publishes one FRED series, with its press-release flag and
      upstream link.
    path: /series/release
    params:
      series_id:
        type: string
        required: true
        description: FRED series id, e.g. GDP.
      realtime_start:
        type: string
        description: Start of the real-time period, YYYY-MM-DD.
      realtime_end:
        type: string
        description: End of the real-time period, YYYY-MM-DD.
    defaults:
      file_type: json
    record_path: releases
    id_field: id
    source_url_template: "https://fred.stlouisfed.org/release?rid={id}"
    fields:
      id: id
      name: name
      press_release: press_release
      link: link
      notes: notes
    exemplars:
      - which release publishes GDP
      - source release for an economic series
    example:
      series_id: GDP
  series_observations:
    description: >-
      Read the observations of one FRED series by id (e.g. UNRATE, CPIAUCSL, GDP,
      DGS10). Returns date/value pairs, newest first by default. Supports date
      ranges, frequency aggregation, unit transformations and vintage dates.
    path: /series/observations
    params:
      series_id:
        type: string
        required: true
        description: FRED series id, e.g. UNRATE.
      observation_start:
        type: string
        description: First observation date, YYYY-MM-DD.
      observation_end:
        type: string
        description: Last observation date, YYYY-MM-DD.
      realtime_start:
        type: string
        description: Start of the real-time period, YYYY-MM-DD.
      realtime_end:
        type: string
        description: End of the real-time period, YYYY-MM-DD.
      frequency:
        type: string
        description: >-
          Lower frequency to aggregate to: d, w, bw, m, q, sa, a, or a weekly
          variant such as wef or weth.
      aggregation_method:
        type: string
        enum: [avg, sum, eop]
        description: How to aggregate when frequency is set (default avg).
      units:
        type: string
        enum: [lin, chg, ch1, pch, pc1, pca, cch, cca, log]
        description: Value transformation, e.g. lin (levels) or pch (percent change).
      output_type:
        type: integer
        enum: [1, 2, 3, 4]
        description: >-
          1 observations by real-time period (default), 2 by vintage date (all),
          3 by vintage date (new/revised), 4 initial release only.
      vintage_dates:
        type: string
        description: Comma-separated YYYY-MM-DD vintage dates to read instead of a real-time period.
      sort_order:
        type: string
        enum: [asc, desc]
        description: Observation order (default desc, newest first).
      limit:
        type: integer
        description: Observations per page (1-1000, default 100).
        default: 100
    defaults:
      file_type: json
      sort_order: desc
    pagination:
      mode: offset
      param: offset
      limit_param: limit
      default_limit: 100
      max_limit: 1000
    record_path: observations
    id_field: date
    source_url_template: "https://fred.stlouisfed.org/series/{series_id}"
    fields:
      date: date
      value: value
    version_field: count
    exemplars:
      - latest unemployment rate values
      - monthly CPI numbers for the last year
      - treasury yield history
      - GDP observations between two dates
      - vintage values of a series as of a past date
    example:
      series_id: UNRATE
      limit: 12
  series_vintage_dates:
    description: >-
      Dates when a FRED series was revised or new values were released. Use a date
      with `series_observations` to read the series as it stood then.
    path: /series/vintagedates
    params:
      series_id:
        type: string
        required: true
        description: FRED series id, e.g. GDP.
      sort_order:
        type: string
        enum: [asc, desc]
        description: Vintage date order (default asc).
      limit:
        type: integer
        description: Vintage dates per page (1-1000, default 20).
        default: 20
    defaults:
      file_type: json
    pagination:
      mode: offset
      param: offset
      limit_param: limit
      default_limit: 20
      max_limit: 1000
    record_path: vintage_dates
    id_field: vintage_date
    source_url_template: "https://fred.stlouisfed.org/series/{series_id}"
    fields:
      vintage_date: value
    version_field: count
    exemplars:
      - when was GDP revised
      - revision history of an economic series
      - vintage dates for a FRED series
    example:
      series_id: GDP
      limit: 5
  series_tags:
    description: >-
      Tags assigned to one FRED series, with group, popularity and series count.
    path: /series/tags
    params:
      series_id:
        type: string
        required: true
        description: FRED series id, e.g. GDP.
      order_by:
        type: string
        description: Result order, e.g. name, group_id, popularity.
      sort_order:
        type: string
        enum: [asc, desc]
        description: Sort direction for order_by.
      limit:
        type: integer
        description: Tags per page (1-1000, default 20).
        default: 20
    defaults:
      file_type: json
    pagination:
      mode: offset
      param: offset
      limit_param: limit
      default_limit: 20
      max_limit: 1000
    record_path: tags
    id_field: name
    source_url_template: "https://fred.stlouisfed.org/tags/series?t={name}"
    fields:
      name: name
      group_id: group_id
      notes: notes
      created: created
      popularity: popularity
      series_count: series_count
    version_field: count
    exemplars:
      - tags for the GDP series
      - what topics describe a FRED series
    example:
      series_id: GDP
      limit: 5
  search_series_tags:
    description: >-
      Tags on the series that match a full-text search. Use it to narrow a search
      before calling `search_series` with tag filters.
    path: /series/search/tags
    params:
      series_search_text:
        type: string
        required: true
        description: Words describing the series, e.g. "unemployment".
      tag_names:
        type: string
        description: Semicolon-delimited tags the series must all have.
      tag_group_id:
        type: string
        description: Restrict tags to a group such as freq, gen, geo, rls, seas or src.
      tag_search_text:
        type: string
        description: Restrict returned tags to those matching this text.
      order_by:
        type: string
        description: Result order, e.g. series_count, popularity, name.
      sort_order:
        type: string
        enum: [asc, desc]
        description: Sort direction for order_by.
      limit:
        type: integer
        description: Tags per page (1-1000, default 20).
        default: 20
    defaults:
      file_type: json
    pagination:
      mode: offset
      param: offset
      limit_param: limit
      default_limit: 20
      max_limit: 1000
    record_path: tags
    id_field: name
    source_url_template: "https://fred.stlouisfed.org/tags/series?t={name}"
    fields:
      name: name
      group_id: group_id
      notes: notes
      created: created
      popularity: popularity
      series_count: series_count
    version_field: count
    exemplars:
      - tags for unemployment search results
      - what tags match an economic topic
    example:
      series_search_text: unemployment
      limit: 5
  search_series_related_tags:
    description: >-
      Tags related to a set of tags within the series matching a text search.
    path: /series/search/related_tags
    params:
      series_search_text:
        type: string
        required: true
        description: Words describing the series, e.g. "unemployment".
      tag_names:
        type: string
        required: true
        description: Semicolon-delimited tags to find related tags for.
      exclude_tag_names:
        type: string
        description: Semicolon-delimited tags to exclude.
      tag_group_id:
        type: string
        description: Restrict tags to a group such as freq, gen, geo, rls, seas or src.
      tag_search_text:
        type: string
        description: Restrict returned tags to those matching this text.
      order_by:
        type: string
        description: Result order, e.g. series_count, popularity, name.
      sort_order:
        type: string
        enum: [asc, desc]
        description: Sort direction for order_by.
      limit:
        type: integer
        description: Tags per page (1-1000, default 20).
        default: 20
    defaults:
      file_type: json
    pagination:
      mode: offset
      param: offset
      limit_param: limit
      default_limit: 20
      max_limit: 1000
    record_path: tags
    id_field: name
    source_url_template: "https://fred.stlouisfed.org/tags/series?t={name}"
    fields:
      name: name
      group_id: group_id
      notes: notes
      created: created
      popularity: popularity
      series_count: series_count
    version_field: count
    exemplars:
      - tags related to usa within unemployment series
      - related tags for an economic topic
    example:
      series_search_text: unemployment
      tag_names: "usa"
      limit: 5

  # -- categories ---------------------------------------------------------
  category:
    description: >-
      Get one category in the FRED category tree. Category 0 is the root; each
      category lists a parent and groups a set of series.
    path: /category
    params:
      category_id:
        type: integer
        description: FRED category id; 0 is the root category.
        default: 0
    defaults:
      file_type: json
    record_path: categories
    id_field: id
    source_url_template: "https://fred.stlouisfed.org/categories/{id}"
    fields:
      id: id
      name: name
      parent_id: parent_id
    exemplars:
      - the root category of FRED
      - what is FRED category 125
      - category tree node for trade balance
    example:
      category_id: 125
  category_children:
    description: >-
      Direct child categories of a FRED category. Walk the tree from 0 to find a
      topic, then list its series with `category_series`.
    path: /category/children
    params:
      category_id:
        type: integer
        description: Parent FRED category id; 0 is the root category.
        default: 0
      realtime_start:
        type: string
        description: Start of the real-time period, YYYY-MM-DD.
      realtime_end:
        type: string
        description: End of the real-time period, YYYY-MM-DD.
    defaults:
      file_type: json
    record_path: categories
    id_field: id
    source_url_template: "https://fred.stlouisfed.org/categories/{id}"
    fields:
      id: id
      name: name
      parent_id: parent_id
    exemplars:
      - subcategories of the FRED root category
      - child categories under money and banking
      - browse the economic data category tree
    example:
      category_id: 0
  category_related:
    description: >-
      Categories related to a FRED category, for adjacent-topic discovery.
    path: /category/related
    params:
      category_id:
        type: integer
        required: true
        description: FRED category id.
      realtime_start:
        type: string
        description: Start of the real-time period, YYYY-MM-DD.
      realtime_end:
        type: string
        description: End of the real-time period, YYYY-MM-DD.
    defaults:
      file_type: json
    record_path: categories
    id_field: id
    source_url_template: "https://fred.stlouisfed.org/categories/{id}"
    fields:
      id: id
      name: name
      parent_id: parent_id
    exemplars:
      - categories related to trade balance
      - adjacent FRED economic categories
    example:
      category_id: 125
  category_series:
    description: >-
      Series inside one FRED category, optionally filtered by frequency, units,
      seasonal adjustment or tags.
    path: /category/series
    params:
      category_id:
        type: integer
        required: true
        description: FRED category id.
      filter_variable:
        type: string
        enum: [frequency, units, seasonal_adjustment]
        description: Attribute to filter with filter_value.
      filter_value:
        type: string
        description: Value for filter_variable, e.g. "Monthly" or "Percent".
      tag_names:
        type: string
        description: Semicolon-delimited tags the series must all have.
      exclude_tag_names:
        type: string
        description: Semicolon-delimited tags the series must not have.
      order_by:
        type: string
        description: Result order, e.g. series_id, title, popularity.
      sort_order:
        type: string
        enum: [asc, desc]
        description: Sort direction for order_by.
      limit:
        type: integer
        description: Series per page (1-1000, default 20).
        default: 20
    defaults:
      file_type: json
    pagination:
      mode: offset
      param: offset
      limit_param: limit
      default_limit: 20
      max_limit: 1000
    record_path: seriess
    id_field: id
    source_url_template: "https://fred.stlouisfed.org/series/{id}"
    fields:
      id: id
      title: title
      units: units
      frequency: frequency
      seasonal_adjustment: seasonal_adjustment
      observation_start: observation_start
      observation_end: observation_end
      last_updated: last_updated
      popularity: popularity
    version_field: count
    exemplars:
      - series in the trade balance category
      - all monthly series in a FRED category
      - browse economic series by category
    example:
      category_id: 125
      limit: 5
  category_tags:
    description: >-
      Tags used by the series in one FRED category, with group and series count.
    path: /category/tags
    params:
      category_id:
        type: integer
        required: true
        description: FRED category id.
      tag_names:
        type: string
        description: Semicolon-delimited tags to filter by.
      exclude_tag_names:
        type: string
        description: Semicolon-delimited tags to exclude.
      tag_group_id:
        type: string
        description: Restrict tags to a group such as freq, gen, geo, rls, seas or src.
      search_text:
        type: string
        description: Restrict returned tags to those matching this text.
      order_by:
        type: string
        description: Result order, e.g. series_count, popularity, name.
      sort_order:
        type: string
        enum: [asc, desc]
        description: Sort direction for order_by.
      limit:
        type: integer
        description: Tags per page (1-1000, default 20).
        default: 20
    defaults:
      file_type: json
    pagination:
      mode: offset
      param: offset
      limit_param: limit
      default_limit: 20
      max_limit: 1000
    record_path: tags
    id_field: name
    source_url_template: "https://fred.stlouisfed.org/tags/series?t={name}"
    fields:
      name: name
      group_id: group_id
      notes: notes
      created: created
      popularity: popularity
      series_count: series_count
    version_field: count
    exemplars:
      - tags in the trade balance category
      - topics covered by a FRED category
    example:
      category_id: 125
      limit: 5
  category_related_tags:
    description: >-
      Tags related to a set of tags within one FRED category.
    path: /category/related_tags
    params:
      category_id:
        type: integer
        required: true
        description: FRED category id.
      tag_names:
        type: string
        required: true
        description: Semicolon-delimited tags to find related tags for.
      exclude_tag_names:
        type: string
        description: Semicolon-delimited tags to exclude.
      tag_group_id:
        type: string
        description: Restrict tags to a group such as freq, gen, geo, rls, seas or src.
      search_text:
        type: string
        description: Restrict returned tags to those matching this text.
      order_by:
        type: string
        description: Result order, e.g. series_count, popularity, name.
      sort_order:
        type: string
        enum: [asc, desc]
        description: Sort direction for order_by.
      limit:
        type: integer
        description: Tags per page (1-1000, default 20).
        default: 20
    defaults:
      file_type: json
    pagination:
      mode: offset
      param: offset
      limit_param: limit
      default_limit: 20
      max_limit: 1000
    record_path: tags
    id_field: name
    source_url_template: "https://fred.stlouisfed.org/tags/series?t={name}"
    fields:
      name: name
      group_id: group_id
      notes: notes
      created: created
      popularity: popularity
      series_count: series_count
    version_field: count
    exemplars:
