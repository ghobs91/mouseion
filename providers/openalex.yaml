id: openalex
title: OpenAlex scholarly works
category: research
description: >-
  OpenAlex: 250M+ scholarly works with title, year, DOI, venue, citation counts and
  type. Keyless at low volume, but anonymous use shares a $0.10/day budget per IP;
  a free key raises it. Use for literature search beyond PubMed.
docs_url: https://docs.openalex.org/
keywords:
  - openalex
  - scholarly
  - paper
  - citation
  - research
  - doi
  - preprint
  - publication
  - literature
base: https://api.openalex.org
adapter: rest_json
auth:
  type: none
attribution: "OpenAlex (CC0)"
cache_ttl: 3600
limits:
  note: "anonymous requests share a small daily budget; a free key raises it."
capabilities:
  search_works:
    description: >-
      Search scholarly works by text. Returns title, publication year, DOI, venue,
      citation count and work type, ranked by relevance.
    path: /works
    params:
      search:
        type: string
        required: true
        description: Free-text query, e.g. "solar cell efficiency".
      limit:
        type: integer
        description: Works per page (1-100, default 10).
        default: 10
      api_key:
        type: string
        description: Optional free OpenAlex API key for a larger daily budget.
    pagination:
      mode: page
      param: page
      limit_param: per-page
      default_limit: 10
      max_limit: 100
      start: 1
    record_path: results
    id_field: id
    source_url_template: "{id}"
    fields:
      id: id
      title: display_name
      year: publication_year
      doi: doi
      citations: cited_by_count
      type: type
      venue: primary_location.source.display_name
      language: language
    version_field: meta.count
    exemplars:
      - papers on perovskite solar cell efficiency
      - most cited work on CRISPR off-target effects
      - recent preprints about protein folding
      - literature on minimum wage and employment
    example:
      search: solar cell efficiency
      limit: 5
