id: nws
title: National Weather Service
category: places
domain: geo_earth_observation
sub_category: hydrometeorology
regions: [US]
description: >-
  NOAA's National Weather Service: active watches, warnings and advisories from
  api.weather.gov, and a seven-day day/night forecast for a US latitude and
  longitude. Alerts include severity, affected areas and expiry; the forecast
  returns 13 periods with conditions, temperature, precipitation probability and
  the narrative. Keyless.
docs_url: https://www.weather.gov/documentation/services-web-api
keywords:
  - weather
  - nws
  - alert
  - warning
  - tornado
  - hurricane
  - flood
  - storm
  - heat advisory
  - forecast
  - temperature
  - rain
  - snow
  - precipitation
base: https://api.weather.gov
adapter: rest_json
auth:
  type: none
attribution: "NOAA / National Weather Service (public domain)"
source:
  is_primary: true
  originator: "NOAA National Weather Service"
  originator_domain: weather.gov
  provenance: official
  tier: 1
  auth_policy:
    free: true
    credit_card_required: false
    trial: false
    evidence_url: https://www.weather.gov/documentation/services-web-api
    verified_at: 2026-10-29
  rate_limit:
    per_min: 300
    burst: 10
    concurrency: 4
cache_ttl: 300
limits:
  rps: 5
capabilities:
  active_alerts:
    description: >-
      Active watches, warnings and advisories for a US state or area code. Returns the
      event, severity, headline, affected areas, sender and expiry.
    path: /alerts/active
    params:
      area:
        type: string
        description: Two-letter state code (CA, TX) or marine area.
      severity:
        type: string
        description: Extreme, Severe, Moderate or Minor.
      limit:
        type: integer
        description: Alerts to return (1-200, default 20).
        default: 20
    defaults:
      status: actual
      message_type: alert
    local_window: true
    pagination:
      mode: offset
      default_limit: 20
      max_limit: 200
    record_path: features
    id_field: alert_id
    source_url_template: "{web}"
    fields:
      alert_id: properties.id
      event: properties.event
      severity: properties.severity
      urgency: properties.urgency
      certainty: properties.certainty
      headline: properties.headline
      areas: properties.areaDesc
      effective: properties.effective
      expires: properties.expires
      sender: properties.senderName
      web: properties.web
    version_field: title
    exemplars:
      - weather alerts in Texas right now
      - tornado warnings active
      - flood advisory for California
      - severe weather warnings
    example:
      area: CA
      limit: 5
  forecast:
    description: >-
      Seven-day day/night forecast for a US latitude and longitude, as the
      National Weather Service publishes it. Returns 13 periods with the period
      label, valid time, high/low, temperature, precipitation probability,
      conditions, hazard and detailed text. Fahrenheit by default; pass unit=1
      for Celsius.
    adapter: nws_forecast
    base: https://forecast.weather.gov
    path: /MapClick.php
    params:
      lat:
        type: number
        required: true
        description: Latitude, e.g. 47.6062.
      lon:
        type: number
        required: true
        description: Longitude, e.g. -122.3321.
      unit:
        type: string
        enum: ["0", "1"]
        default: "0"
        description: "0 for Fahrenheit (default), 1 for Celsius."
      limit:
        type: integer
        description: Periods to return (1-13, default 13).
        default: 13
    defaults:
      FcstType: json
    pagination:
      mode: offset
      default_limit: 13
      max_limit: 13
    local_window: true
    id_template: "{start}:{period}"
    source_url_template: "https://forecast.weather.gov/MapClick.php?lat={lat}&lon={lon}"
    fields:
      period: period
      start: start
      temp_label: temp_label
      temperature: temperature
      precipitation_probability: precipitation_probability
      weather: weather
      detail: detail
      icon: icon
      hazard: hazard
      hazard_url: hazard_url
      area: area
    exemplars:
      - what is the weather forecast for Seattle
      - will it rain tomorrow in New York
      - seven day forecast for a latitude and longitude
      - high and low temperatures this week
      - do I need an umbrella tomorrow
    example:
      lat: 47.6062
      lon: -122.3321
