id: wa_campaign_finance
title: Washington Campaign Contributions
category: government
domain: civic_local
sub_category: campaign_finance
transport: http
adapter: socrata
base: https://data.wa.gov
regions: [US]
description: >-
  Contributions to Washington state and local candidates and political
  committees, reported to the Public Disclosure Commission. One row per
  contribution, with donor, employer, occupation, amount, committee and race.
docs_url: https://data.wa.gov/d/kv7h-kjye
keywords:
  - campaign finance
  - campaign contributions
  - donors
  - political action committee
  - washington state
  - public disclosure commission
  - who funded
attribution: "Washington State Public Disclosure Commission"
source:
  is_primary: true
  originator: "Washington State Public Disclosure Commission"
  originator_domain: data.wa.gov
  provenance: official
  tier: 1
  auth_policy:
    free: true
    credit_card_required: false
    trial: false
    evidence_url: https://data.wa.gov/d/kv7h-kjye
    verified_at: 2026-10-30
  rate_limit: {per_min: 30, burst: 5, concurrency: 2}
cache_ttl: 86400
capabilities:
  contributions:
    description: >-
      Search Washington campaign contributions by donor, committee, office,
      jurisdiction or free text. Returns donor, employer, amount and date.
    path: /resource/kv7h-kjye.json
    params:
      query: {type: string, description: "full-text search over filer, donor and description"}
      filer: {type: string, description: "committee or candidate name, exact match"}
      election_year: {type: integer, description: "e.g. 2024"}
      jurisdiction: {type: string, description: "e.g. 'Statewide', 'King County'"}
      limit: {type: integer, default: 25}
    alias: {query: q, filer: filer_name}
    pagination: {mode: offset, param: offset, limit_param: limit, default_limit: 25, max_limit: 1000}
    id_field: id
    fields:
      id: id
      filer: filer_name
      office: office
      party: party
      jurisdiction: jurisdiction
      jurisdiction_county: jurisdiction_county
      election_year: election_year
      amount: amount
      kind: cash_or_in_kind
      date: receipt_date
      contributor: contributor_name
      contributor_city: contributor_city
      contributor_state: contributor_state
      contributor_occupation: contributor_occupation
      contributor_employer: contributor_employer_name
      description: description
      report_url: url
    pluck: {report_url: url}
    source_url_template: "{report_url}"
    query_map: {text: query, limit: limit}
    exemplars:
      - who contributed to a Washington state senate campaign
      - Washington campaign donors by employer
      - Public Disclosure Commission contributions
    example: {limit: 3}
