id: sec_press
title: SEC press releases
category: finance
domain: financial_sovereign
sub_category: agency_announcements
adapter: rss
base: https://www.sec.gov
regions: [US]
description: >-
  The Securities and Exchange Commission's official press releases: enforcement
  actions and charges, settlements, rule proposals, exemptive relief and
  Commission announcements. SEC requires a User-Agent that identifies the
  caller: set SEC_USER_AGENT to "Your Name you@example.com". Keyless.
docs_url: https://www.sec.gov/news/pressreleases
keywords:
  - sec
  - securities and exchange commission
  - press release
  - enforcement action
  - charges
  - settlement
  - exemptive relief
  - rule proposal
  - securities fraud
attribution: "U.S. Securities and Exchange Commission"
auth:
  type: user_agent
  env: SEC_USER_AGENT
source:
  is_primary: true
  originator: "U.S. Securities and Exchange Commission"
  originator_domain: sec.gov
  provenance: official
  tier: 1
  auth_policy:
    free: true
    credit_card_required: false
    trial: false
    evidence_url: https://www.sec.gov/news/pressreleases
    verified_at: 2026-11-01
  rate_limit: {per_min: 300, burst: 10, concurrency: 4}
cache_ttl: 600
limits:
  rps: 5
capabilities:
  announcements:
    description: >-
      Recent SEC press releases, newest first. Returns the title, link,
      publication date, summary and author. `query` filters the current window by
      keyword across title and summary; there is no server-side search on a feed.
    path: /news/pressreleases.rss
    params:
      query:
        type: string
        description: >-
          Keyword filter applied locally to the current window's title and
          summary, e.g. 'charges' or 'exemptive relief'.
      limit:
        type: integer
        description: Records per page (1-50, default 20).
        default: 20
    pagination: {mode: offset, default_limit: 20, max_limit: 50}
    local_window: true
    id_field: id
    fields:
      id: id
      title: title
      link: link
      published: published
      summary: summary
      author: author
      categories: categories
    strip_html: [summary]
    source_url_template: "{link}"
    query_map: {text: query, limit: limit}
    exemplars:
      - latest sec press releases
      - what charges did the sec announce
      - securities and exchange commission settlement
      - sec exemptive relief announcement
    example: {limit: 5}
