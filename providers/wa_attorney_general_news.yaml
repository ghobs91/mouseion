id: wa_attorney_general_news
title: Washington attorney general news
category: government
domain: governance_legislative
sub_category: state_government_announcements
adapter: rss
base: https://www.atg.wa.gov
regions: [US]
jurisdictions: [US-WA]
description: >-
  The Washington State Office of the Attorney General's official news feed:
  lawsuits, consumer alerts, settlements, Medicaid fraud actions and legal
  opinions, as the office publishes them. Returns title, link, publication date
  and summary. Keyless.
docs_url: https://www.atg.wa.gov/news
keywords:
  - washington attorney general
  - wa attorney general
  - washington lawsuit
  - consumer alert washington
  - olympia attorney general
  - medicaid fraud washington
attribution: "Washington State Office of the Attorney General"
auth:
  type: none
source:
  is_primary: true
  originator: "Washington State Office of the Attorney General"
  originator_domain: atg.wa.gov
  provenance: official
  tier: 1
  auth_policy:
    free: true
    credit_card_required: false
    trial: false
    evidence_url: https://www.atg.wa.gov/news
    verified_at: 2026-11-01
  rate_limit: {per_min: 30, burst: 5, concurrency: 2}
cache_ttl: 600
limits:
  rps: 1
capabilities:
  announcements:
    description: >-
      Recent Washington attorney general announcements, newest first. Returns
      the title, link, publication date and summary. `query` filters the current
      window by keyword across title and summary.
    path: /rss.xml
    params:
      query:
        type: string
        description: >-
          Keyword filter applied locally, e.g. 'consumer' or 'lawsuit'.
      limit:
        type: integer
        description: Records per page (1-50, default 20).
        default: 20
    pagination: {mode: offset, default_limit: 20, max_limit: 50}
    local_window: true
    id_field: id
    fields:
      id: id
      title: title
      link: link
      published: published
      summary: summary
      author: author
      categories: categories
    strip_html: [summary]
    source_url_template: "{link}"
    query_map: {text: query, limit: limit}
    exemplars:
      - what did the Washington attorney general announce
      - Washington state lawsuit
      - consumer alert from the Washington AG
      - Olympia legal action
    example: {limit: 5}
