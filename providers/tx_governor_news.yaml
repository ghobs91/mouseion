id: tx_governor_news
title: Texas governor news
category: government
domain: governance_legislative
sub_category: state_government_announcements
adapter: rss
base: https://gov.texas.gov
regions: [US]
jurisdictions: [US-TX]
description: >-
  The Office of the Texas Governor's official news feed: appointments,
  disaster declarations, economic development announcements, border and
  emergency actions, and statements, as the office publishes them. Returns
  title, link, date and summary. Keyless.
docs_url: https://gov.texas.gov/news
keywords:
  - texas governor
  - governor abbott
  - texas appointment
  - texas disaster declaration
  - austin state government
  - texas economic development
attribution: "Office of the Texas Governor"
auth:
  type: none
source:
  is_primary: true
  originator: "Office of the Texas Governor"
  originator_domain: texas.gov
  provenance: official
  tier: 1
  auth_policy:
    free: true
    credit_card_required: false
    trial: false
    evidence_url: https://gov.texas.gov/news
    verified_at: 2026-11-01
  rate_limit: {per_min: 30, burst: 5, concurrency: 2}
cache_ttl: 600
limits:
  rps: 1
capabilities:
  announcements:
    description: >-
      Recent Texas governor announcements, newest first. This feed carries the
      date in dc:date rather than pubDate. Returns the title, link, date and
      summary. `query` filters the current window by keyword.
    path: /news/rss
    params:
      query:
        type: string
        description: >-
          Keyword filter applied locally, e.g. 'appointment' or 'disaster'.
      limit:
        type: integer
        description: Records per page (1-50, default 20).
        default: 20
    pagination: {mode: offset, default_limit: 20, max_limit: 50}
    local_window: true
    id_field: id
    fields:
      id: id
      title: title
      link: link
      published: published
      summary: summary
      author: author
      categories: categories
    strip_html: [summary]
    source_url_template: "{link}"
    query_map: {text: query, limit: limit}
    exemplars:
      - what did the Texas governor announce
      - Texas disaster declaration
      - governor abbott appointment
      - Texas economic development announcement
    example: {limit: 5}
