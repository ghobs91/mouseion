id: mbta_news
title: MBTA news
category: places
domain: transport_infrastructure
sub_category: transit_announcements
adapter: rss
base: https://www.mbta.com
regions: [US]
description: >-
  The Massachusetts Bay Transportation Authority's official news feed: service
  changes, capital projects, accessibility updates and agency announcements for
  Boston-area subway, bus, commuter rail and ferry service. Returns title, link,
  publication date and summary. Keyless.
docs_url: https://www.mbta.com/news
keywords:
  - mbta
  - boston transit
  - subway
  - commuter rail
  - bus service
  - ferry
  - service change
  - transit announcement
  - red line
  - green line
  - orange line
  - blue line
attribution: "Massachusetts Bay Transportation Authority"
auth:
  type: none
source:
  is_primary: true
  originator: "Massachusetts Bay Transportation Authority"
  originator_domain: mbta.com
  provenance: official
  tier: 1
  auth_policy:
    free: true
    credit_card_required: false
    trial: false
    evidence_url: https://www.mbta.com/news
    verified_at: 2026-11-01
  rate_limit: {per_min: 30, burst: 5, concurrency: 2}
cache_ttl: 600
limits:
  rps: 1
capabilities:
  announcements:
    description: >-
      Recent MBTA news items, newest first. Returns the title, link, publication
      date, summary and author. `query` filters the current window by keyword
      across title and summary; there is no server-side search on a feed.
    path: /news/rss.xml
    params:
      query:
        type: string
        description: >-
          Keyword filter applied locally to the current window's title and
          summary, e.g. 'red line' or 'accessibility'.
      limit:
        type: integer
        description: Records per page (1-50, default 20).
        default: 20
    pagination: {mode: offset, default_limit: 20, max_limit: 50}
    local_window: true
    id_field: id
    fields:
      id: id
      title: title
      link: link
      published: published
      summary: summary
      author: author
      categories: categories
    strip_html: [summary]
    source_url_template: "{link}"
    query_map: {text: query, limit: limit}
    exemplars:
      - latest mbta service announcements
      - boston subway service change
      - mbta news about the red line
      - commuter rail update from the mbta
    example: {limit: 5}
