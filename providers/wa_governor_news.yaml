id: wa_governor_news
title: Washington governor news
category: government
domain: governance_legislative
sub_category: state_government_announcements
adapter: rss
base: https://www.governor.wa.gov
regions: [US]
jurisdictions: [US-WA]
description: >-
  The Office of the Governor of Washington's official news feed: appointments,
  executive orders, budget and policy announcements, and statements, as the
  office publishes them. Returns title, link, publication date and summary.
  Keyless.
docs_url: https://www.governor.wa.gov/news-media
keywords:
  - washington governor
  - governor ferguson
  - washington executive order
  - washington state appointments
  - olympia state government
  - washington budget
attribution: "Office of the Governor of Washington"
auth:
  type: none
source:
  is_primary: true
  originator: "Office of the Governor of Washington"
  originator_domain: wa.gov
  provenance: official
  tier: 1
  auth_policy:
    free: true
    credit_card_required: false
    trial: false
    evidence_url: https://www.governor.wa.gov/news-media
    verified_at: 2026-11-01
  rate_limit: {per_min: 30, burst: 5, concurrency: 2}
cache_ttl: 600
limits:
  rps: 1
capabilities:
  announcements:
    description: >-
      Recent Washington governor announcements, newest first. Returns the title,
      link, publication date and summary. `query` filters the current window by
      keyword across title and summary.
    path: /rss.xml
    params:
      query:
        type: string
        description: >-
          Keyword filter applied locally, e.g. 'appointment' or 'executive
          order'.
      limit:
        type: integer
        description: Records per page (1-50, default 20).
        default: 20
    pagination: {mode: offset, default_limit: 20, max_limit: 50}
    local_window: true
    id_field: id
    fields:
      id: id
      title: title
      link: link
      published: published
      summary: summary
      author: author
      categories: categories
    strip_html: [summary]
    source_url_template: "{link}"
    query_map: {text: query, limit: limit}
    exemplars:
      - what did the Washington governor announce
      - Washington state executive order
      - governor ferguson appointment
      - Olympia budget announcement
    example: {limit: 5}
