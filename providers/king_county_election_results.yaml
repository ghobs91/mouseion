id: king_county_election_results
title: King County Election Results
category: government
domain: civic_local
sub_category: election_results
transport: http
adapter: socrata
base: https://data.kingcounty.gov
regions: [US]
description: >-
  Precinct-level election results for King County, Washington, from 2004 to 2026.
  King County publishes one dataset per election, so this provider maps a stable
  election key to the right dataset and projects the columns the datasets share.
  Returns race, precinct, party, vote type and count.
docs_url: https://data.kingcounty.gov/
keywords:
  - election results
  - king county
  - seattle
  - washington
  - precinct results
  - vote counts
  - ballot results
attribution: "King County Elections"
source:
  is_primary: true
  originator: "King County Elections"
  originator_domain: data.kingcounty.gov
  provenance: official
  tier: 1
  auth_policy:
    free: true
    credit_card_required: false
    trial: false
    evidence_url: https://data.kingcounty.gov/
    verified_at: 2026-10-30
  rate_limit: {per_min: 30, burst: 5, concurrency: 2}
cache_ttl: 604800
capabilities:
  results:
    description: >-
      Read one King County election by precinct. Pass `election` as a key such as
      `2024_general` or `2026_primary`; `provider_describe` lists every key.
      Final results are included; election-night abstracts are not.
    path: /resource/{dataset}.json
    dataset_param: election
