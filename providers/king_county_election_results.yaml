    params:
      election: {type: string, required: true, description: "election key, e.g. 2024_general"}
      query: {type: string, description: "full-text search over race and precinct"}
      race: {type: string, description: "race or contest name, exact match"}
      precinct: {type: string, description: "precinct code, exact match"}
      limit: {type: integer, default: 25}
    alias: {query: q}
    pagination: {mode: offset, param: offset, limit_param: limit, default_limit: 25, max_limit: 1000}
    id_template: "{precinct}:{race}:{counter_group}:{counter_type}"
    fields:
      precinct: precinct
      race: race
      party: party
      counter_group: countergroup
      counter_type: [countertype, counttype]
      votes: [sumofcount, count]
      legislative_district: leg
      county_council_district: cc
      congressional_district: cong
    source_url_template: "https://data.kingcounty.gov/d/{dataset}"
    query_map: {text: query, limit: limit}
    exemplars:
      - King County election results by precinct
      - Seattle precinct vote counts
      - how many votes did a candidate get in King County
    example: {election: "2024_general", limit: 3}
