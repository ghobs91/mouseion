id: north_carolina_election_results
title: North Carolina Election Results
category: government
domain: civic_local
sub_category: election_results
transport: http
adapter: csv
base: https://dl.ncsbe.gov
regions: [US]
jurisdictions: [US-NC]
description: >-
  Precinct-level North Carolina election results from the State Board of
  Elections, by contest, choice and voting method. Each election is a ZIP with
  one tab-delimited file; pass `election` as a key such as `2025_09_09`. The
  Board refreshes the file through election night and after certification.
docs_url: https://www.ncsbe.gov/results-data/election-results
keywords:
  - election results
  - north carolina
  - precinct results
  - vote counts
  - ncsbe
attribution: "North Carolina State Board of Elections"
source:
  is_primary: true
  originator: "North Carolina State Board of Elections"
  originator_domain: ncsbe.gov
  provenance: official
  tier: 1
  auth_policy:
    free: true
    credit_card_required: false
    trial: false
    evidence_url: https://www.ncsbe.gov/results-data/election-results
    verified_at: 2026-11-04
  rate_limit: {per_min: 20, burst: 4, concurrency: 2}
cache_ttl: 300
capabilities:
  results:
    description: >-
      Read one North Carolina election by precinct. Pass `election` as a key such
      as `2025_09_09`; `provider_describe` lists every key. Returns county,
      precinct, contest, choice, party and votes split by election day, early
      voting, absentee by mail and provisional.
    path: /ENRS/{dataset}.zip
    params:
      election:
        type: string
        required: true
        description: "election key, e.g. 2025_09_09"
      limit:
        type: integer
        default: 25
        description: "rows per page (1-1000)"
    dataset_param: election
    datasets:
      "2016_03_15": "2016_03_15/results_pct_20160315"
      "2016_06_07": "2016_06_07/results_pct_20160607"
      "2016_11_08": "2016_11_08/results_pct_20161108"
      "2017_09_12": "2017_09_12/results_pct_20170912"
