      param: offset
      limit_param: limit
      default_limit: 25
      max_limit: 1000
    local_window: true
    id_template: "{county}:{precinct}:{contest_group_id}:{choice}"
    fields:
      county: "County"
      election_date: "Election Date"
      precinct: "Precinct"
      contest_group_id: "Contest Group ID"
      contest_type: "Contest Type"
      contest_name: "Contest Name"
