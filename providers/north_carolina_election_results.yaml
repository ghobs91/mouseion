      provisional: "Provisional"
      total_votes: "Total Votes"
      real_precinct: "Real Precinct"
    source_url_template: "https://dl.ncsbe.gov/ENRS/{dataset}.zip"
    exemplars:
      - North Carolina election results by precinct
      - NC precinct vote counts
      - how many votes did a candidate get in a North Carolina precinct
    example: {election: "2025_09_09", limit: 5}
